[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "restaucontrol-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "SQLAlchemy>=2,<2.1",
    "pyodbc>=5,<6",
]

[tool.setuptools.packages.find]
include = ["app*"]
